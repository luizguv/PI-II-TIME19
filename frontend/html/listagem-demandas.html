<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <!-- Importando o CSS global do grupo e o CSS específico da tela -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/listagem-demandas.css">
<link rel="stylesheet" href="../css/integracao.css">
<script src="../js/api.js" defer></script>
</head>
<body>

    <!-- Menu Superior Simples -->
    <header class="topo-site">
        <div class="container menu-container">
            <h1>Sistema de Demandas</h1>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="listagem-demandas.html" class="ativo">Demandas</a>
                <a href="listagem-demandas.html">Sair</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        
        <!-- Cabeçalho da página com o botão de cadastrar -->
        <div class="cabecalho-pagina">
            <div>
                <h2>Lista de Demandas</h2>
                <p>Gerencie as tarefas e defeitos do projeto</p>
            </div>
            <a href="cadastrodemanda.html" class="btn btn-primary">+ Nova Demanda</a>   
        </div>

        <!-- Área de Filtros Básicos -->
        <div class="card caixa-filtros">
            <div class="grupo-filtro">
                <label class="label" for="busca">Buscar</label>
                <!-- Atributo list conectado ao datalist de sugestões -->
                <input type="text" id="busca" class="input" placeholder="Digite ao menos 3 letras..." maxlength="61" list="sugestoes-demandas">
                <datalist id="sugestoes-demandas"></datalist>
                <small id="buscaErro" class="field-hint field-error" style="display:none;"></small>
            </div>
            <div class="grupo-filtro">
                <label class="label" for="filtro-status">Status</label>
                <select id="filtro-status" class="input">
                    <option value="">Todos</option>
                    <option value="Aberta">Aberta</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Em revisão">Em revisão</option>
                    <option value="Concluída">Concluída</option><option value="Cancelada">Cancelada</option>
                </select>
            </div>
        </div>

        <div id="apiMessage" role="alert"></div><div class="extra-filters">
        <label>Prioridade<select id="filtro-prioridade" class="input"><option value="">Todas</option><option>Crítica</option><option>Alta</option><option>Média</option><option>Baixa</option></select></label>
        <label>Tipo<select id="filtro-tipo" class="input"><option value="">Todos</option><option>Tarefa</option><option>Defeito</option><option>Melhoria</option><option>Documentação</option></select></label>
        <label>Projeto<select id="filtro-projeto" class="input"><option value="">Todos</option></select></label>
        <label>Ordenar por<select id="ordenarPor" class="input"><option value="dataCriacao">Mais recentes</option><option value="titulo">Título</option><option value="prioridade">Prioridade</option><option value="status">Status</option><option value="prazoFinalizacao">Prazo</option></select></label></div>
        <div class="card tabela-card table-wrap">
            <table class="tabela-demandas">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Prazo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </main>

    <script src="../js/listagem-demandas.js" defer></script>

</body>
</html>
