<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Demandas | Edição da Demanda</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/edicao-demanda.css" />
    <script src="../js/edicao-demanda.js" defer></script>
  </head>
  <body>
    <main class="demand-page">
      <header class="demand-header">
        <div>
          <span class="page-overline">Gestão de Demandas</span>
          <h1 id="pageTitle">Editar demanda</h1>
          <p>Preencha as informações para editar esta demanda.</p>
        </div>
      </header>

      <section class="demand-card">
        <form id="demandForm" novalidate>
          <div class="form-section">
            <h2>Informações da demanda</h2>

            <p class="section-description">
              Informe os dados principais da atividade.
            </p>
          </div>

          <div class="form-grid">
            <div class="form-group form-group-full">
              <label class="label" for="title">Título</label>

              <input
                class="input"
                type="text"
                id="title"
                name="title"
                placeholder="Digite o título da demanda"
                maxlength="150"
                required
              />
            </div>

            <div class="form-group form-group-full">
              <label class="label" for="description">Descrição</label>

              <textarea
                class="textarea"
                id="description"
                name="description"
                placeholder="Descreva a demanda, seus objetivos e informações relevantes"
                rows="6"
                maxlength="2000"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label class="label" for="type">Tipo da demanda</label>

              <select class="input select" id="type" name="type" required>
                <option value="">Selecione o tipo</option>
                <option value="Tarefa">Tarefa</option>
                <option value="Defeito">Defeito</option>
                <option value="Melhoria">Melhoria</option>
                <option value="Documentação">Documentação</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="priority">Prioridade</label>

              <select
                class="input select"
                id="priority"
                name="priority"
                required
              >
                <option value="">Selecione a prioridade</option>
                <option value="Crítica">Crítica</option>
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="project">Projeto</label>

              <select class="input select" id="project" name="project" required>
                <option value="">Selecione o projeto</option>
                <option value="1">Portal do Cliente</option>
                <option value="2">App Mobile</option>
                <option value="3">API de Integração</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="responsible">Responsável</label>

              <select class="input select" id="responsible" name="responsible">
                <option value="">Não atribuído</option>
                <option value="1">Admin Geral</option>
                <option value="2">Caio Peccinato</option>
                <option value="3">Leonardo Alves</option>
                <option value="4">Luiz Urias</option>
                <option value="5">Vinicius Matos</option>
              </select>
            </div>

            <div class="form-group" id="statusGroup">
              <label class="label" for="status">Status</label>

              <select class="input select" id="status" name="status">
                <option value="Aberta">Aberta</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Em revisão">Em revisão</option>
                <option value="Concluída">Concluída</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label" for="deadline"> Prazo de finalização </label>

              <input
                class="input"
                type="date"
                id="deadline"
                name="deadline"
                required
              />

              <small id="holidayMessage" class="field-hint field-error"></small>
            </div>
          </div>

          <div
            id="formMessage"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></div>

          <footer class="form-actions">
            <a href="detalhes-demanda.html" class="btn btn-secondary" id="cancelarLink">
              Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
              <span id="submitText">Salvar alterações</span>
            </button>
          </footer>
        </form>
      </section>
    </main>
  </body>
</html>
