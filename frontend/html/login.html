<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sistema de Acompanhamento de Demandas de Desenvolvimento"
    >

    <title>Gestão de Demandas | Login</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-brand">

            <div class="login-brand-content">

                <div class="login-logo">
                    GD
                </div>

                <h1>
                    Gestão de<br>
                    Demandas
                </h1>

                <p>
                    Acompanhe projetos, organize demandas
                    e gerencie o andamento das atividades
                    de desenvolvimento.
                </p>

            </div>

        </section>

        <section class="login-form-section">

            <div class="login-card">

                <header class="login-header">

                    <span class="login-welcome">
                        Acesso ao sistema
                    </span>

                    <h2>
                        Bem-vindo!
                    </h2>

                    <p>
                        Entre com suas credenciais para continuar.
                    </p>

                </header>

                <form id="loginForm">

                    <div class="login-input-group">

                        <label
                            class="label"
                            for="email"
                        >
                            E-mail
                        </label>

                        <input
                            class="input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="login-input-group">

                        <div class="login-password-header">

                            <label
                                class="label"
                                for="password"
                            >
                                Senha
                            </label>

                            <a
                                href="#"
                                class="login-forgot-password"
                            >
                                Esqueci minha senha
                            </a>

                        </div>

                        <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <div
                        id="loginError"
                        class="login-error"
                    >
                        E-mail ou senha inválidos.
                    </div>

                    <div class="login-remember">

                        <label>

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <span>
                                Lembrar de mim
                            </span>

                        </label>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary login-button"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
