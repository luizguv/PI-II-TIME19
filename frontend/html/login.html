<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Acompanhamento de Demandas de Desenvolvimento">

    <title>Gestão de Demandas | Login</title>

    <!-- arquivos de estilo da pagina -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">

    <!-- estilo dos requisitos de senha -->
    <style>
        .password-requirements {
            display: none;
            margin-top: 10px;
            font-size: 12px;
        }

        .password-requirements p {
            margin: 4px 0;
            color: #d9534f;
        }

        .password-requirements p.valid {
            color: #218838;
        }
    </style>
<link rel="stylesheet" href="../css/integracao.css">
<!-- script compartilhado de acesso a api -->
<script src="../js/api.js" defer></script>
</head>

<body>

    <!-- pagina de login -->
    <main class="login-page">

        <!-- lado esquerdo com o nome do sistema -->
        <section class="login-brand">
            <div class="login-brand-content">
                <div class="login-logo">GD</div>

                <h1>Gestão de<br>Demandas</h1>

                <p>
                    Acompanhe projetos, organize demandas
                    e gerencie o andamento das atividades
                    de desenvolvimento.
                </p>
            </div>
        </section>

        <!-- lado direito com o formulario -->
        <section class="login-form-section">
            <div class="login-card">

                <!-- titulo de boas-vindas -->
                <header class="login-header">
                    <span class="login-welcome">Acesso ao sistema</span>
                    <h2>Bem-vindo!</h2>
                    <p>Entre com suas credenciais para continuar.</p>
                </header>

                <!-- formulario de login -->
                <form id="loginForm" novalidate>

                    <!-- campo de e-mail -->
                    <div class="login-input-group">
                        <label class="label" for="email">E-mail</label>

                        <input
                            class="input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- campo de senha -->
                    <div class="login-input-group">

                        <div class="login-password-header">
                            <label class="label" for="password">Senha</label>

                            <!-- link esqueci minha senha -->
                            <a href="#" class="login-forgot-password" id="forgotPasswordLink">
                                Esqueci minha senha
                            </a>
                        </div>

                        <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            maxlength="256"
                            required
                        >

                    </div>

                    <!-- mensagem de erro do login -->
                    <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>

                    <!-- caixa lembrar de mim -->
                    <div class="login-remember">
                        <label>
                            <input type="checkbox" id="remember" name="remember">
                            <span>Lembrar de mim</span>
                        </label>
                    </div>

                    <!-- botao entrar -->
                    <button type="submit" class="btn btn-primary login-button"> <!-- FLUXO:ENTRAR 1/5 botao Entrar -->
                        Entrar
                    </button>

                </form>
            </div>
        </section>

    </main>

    <!-- script da tela de login -->
    <script src="../js/login.js" defer></script>

</body>
</html>
