<!--
  Autor: João Pedro Silveira de Souza
  Componente: Projeto Integrador II - PUC-Campinas
  Descrição: Tela de Detalhes de Demanda (os dados são carregados da API pelo JavaScript)
-->

<!doctype html>
<html lang="pt-br">
  <head>
    <!-- script compartilhado de acesso a api -->
    <script src="../js/api.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detalhes demanda</title>

    <!-- arquivos de estilo da pagina -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/detalhes-demanda.css" />
    <!-- script da tela de detalhes -->
    <script src="../js/detalhes-demanda.js" defer></script>
      <link rel="stylesheet" href="../css/integracao.css">
  </head>

  <body>
    <!-- menu superior -->
    <header>
      <div class="cabecalho container">
        <h1>Sistema de Demandas</h1>

        <!-- links do menu -->
        <div class="navegacao"> 
          <a href="./dashboard.html">Dashboard</a>
          <a href="./listagem-demandas.html">Demandas</a>
          <a href="./login.html">Sair</a>
        </div>
      </div>
    </header>

    <!-- conteudo principal da pagina -->
    <main class="container">

      <!-- mensagens de erro e de sucesso -->
      <div id="erroGeral" class="oculto"></div>
      <div id="mensagemSucesso" class="oculto"></div>

      <!-- conteudo da demanda (escondido ate carregar) -->
      <div id="conteudoDemanda" class="oculto">

        <!-- titulo e classificacao da demanda -->
        <div class="identificacao-demanda">

          <h2 id="tituloDemanda">Carregando...</h2>

          <!-- tipo, prioridade e status -->
          <div class="classificacao-demanda">

            <h5 class="tipo">
              Classificação: <span id="valorClassificacao">-</span>
            </h5>

            <h5 class="prioridade">
              Prioridade: <span id="valorPrioridade">-</span>
            </h5>

            <h5 class="status">
              Status: <span id="valorStatus">-</span>
            </h5>

          </div>

        </div>

        <!-- descricao da demanda -->
        <div class="secao-descricao">

          <div class="descricao">

            <h3>Descrição</h3>

            <p id="valorDescricao"></p>

          </div>

        </div>

        <!-- projeto, responsavel e datas -->
        <div class="secao-projeto">

          <div class="projeto">

            <div class="informacao-projeto">
              <h4>Projeto</h4>
              <p id="valorProjeto">-</p>
            </div>

            <div class="informacao-projeto">
              <h4>Responsável</h4>
              <p id="valorResponsavel">-</p>
            </div>

            <div class="informacao-projeto">
              <h4>Criado em</h4>
              <p id="valorCriadoEm">-</p>
            </div>

            <div class="informacao-projeto">
              <h4>Prazo</h4>
              <p id="valorPrazo">-</p>
            </div>

            <div class="informacao-projeto">
              <h4>Última atualização</h4>
              <p id="valorAtualizacao">-</p>
            </div>

          </div>

        </div>

        <!-- secao para mudar o status -->
        <!-- lista de status e botao de atualizar -->
        <div id="secaoStatus" class="secao-status oculto">

          <!-- lista de novos status permitidos -->
          <label for="novoStatus" class="rotulo-edicao">Alterar status:</label>

          <select id="novoStatus" name="novoStatus"></select>

          <!-- botao atualizar status -->
          <button type="button" id="botaoAtualizarStatus" class="botao-status"> <!-- FLUXO:ATUALIZAR-STATUS 1/7 botao Atualizar status -->
            Atualizar status
          </button>

          <!-- mensagem de erro do status -->
          <div id="erroStatus" class="oculto"></div>

        </div>

        <!-- botao editar demanda -->
        <div class="secao-botao">

          <a class="botao-editar-demanda oculto" id="editarDemanda"> <!-- FLUXO:EDITAR-ABRIR 1/5 link Editar demanda -->
            Editar demanda
          </a>

        </div>

        <!-- secao do formulario de edicao (escondida ate clicar em editar) -->
        <div id="secao-formulario-edicao-demanda" class="oculto">

          <!-- formulario de edicao da demanda -->
          <form id="formEditarDemanda">

            <!-- campo titulo -->
            <label for="tituloEdicao" class="rotulo-edicao">
              Título da demanda:
            </label>

            <input
              type="text"
              id="tituloEdicao"
              name="tituloEdicao"
              maxlength="150"
            />

            <!-- campo descricao -->
            <label for="descricaoEdicao" class="rotulo-edicao">
              Descrição da demanda:
            </label>

            <textarea
              id="descricaoEdicao"
              name="descricaoEdicao"
              maxlength="2000"
              rows="5"
            ></textarea>

            <!-- campo classificacao -->
            <label for="classificacao" class="escolha-classificacao">
              Escolha a classificação da demanda:
            </label>

            <select name="classificacao" id="classificacao">
              <option value="Tarefa">Tarefa</option>
              <option value="Defeito">Defeito</option>
              <option value="Melhoria">Melhoria</option>
              <option value="Documentação">Documentação</option>
            </select>

            <!-- campo prioridade -->
            <label for="prioridade" class="escolha-prioridade">
              Escolha a prioridade da demanda:
            </label>

            <select name="prioridade" id="prioridade">
              <option value="Crítica">Crítica</option>
              <option value="Alta">Alta</option>
              <option value="Média">Média</option>
              <option value="Baixa">Baixa</option>
            </select>

            <!-- campo responsavel -->
            <label for="responsavelEdicao" class="rotulo-edicao">
              Escolha o responsável pela demanda:
            </label>

            <select name="responsavelEdicao" id="responsavelEdicao">
              <option value="">Sem responsável</option>
            </select>

            <!-- campo prazo -->
            <label for="prazoEdicao" class="escolha-prazo">
              Prazo da demanda (opcional):
            </label>

            <input
              type="date"
              id="prazoEdicao"
              name="prazoEdicao"
            />

            <!-- mensagem de erro da edicao -->
            <div id="erroEdicao" class="oculto"></div>

            <!-- botoes cancelar e salvar -->
            <div class="botoes-edicao">

              <button type="button" id="cancelarEdicao">
                Cancelar
              </button>

              <button type="submit" id="salvarEdicao"> <!-- FLUXO:SALVAR-ALTERACOES 1/6 botao Salvar alteracoes -->
                Salvar alterações
              </button>

            </div>

          </form>

        </div>

        <!-- secao de comentarios -->
        <div class="secao-comentarios">

          <div class="comentarios">

            <h3>Comentários</h3>

            <!-- formulario para enviar comentario -->
            <form id="formComentarios">

              <label for="comentario"></label>

              <!-- campo do comentario -->
              <textarea
                name="comentario"
                id="comentario"
                placeholder="Digite seu comentário aqui: "
              ></textarea>

              <!-- contador de caracteres -->
              <div class="contador">
                <p id="contador">0/300</p>
              </div>

              <!-- mensagem de erro do comentario -->
              <div id="erroComentario" class="oculto"></div>

              <!-- botao enviar comentario -->
              <div class="secao-botao-comentarios">

                <button type="submit" id="botaoComentario" class="botao-comentario"> <!-- FLUXO:ENVIAR-COMENTARIO 1/5 botao Enviar Comentario -->
                  Enviar Comentário
                </button>

              </div>

            </form>

            <!-- lista de comentarios -->
            <div id="listaComentarios"></div>

          </div>

        </div>

        <!-- secao de historico -->
        <div class="secao-historico">

          <div class="historico">

            <h3>Histórico</h3>

            <!-- lista do historico de alteracoes -->
            <div id="listaHistorico"></div>

          </div>

        </div>

      </div>

    </main>

  </body>
</html>
